# Gabarito: compose de produção com segredos vindos de arquivo gerado pela esteira (fora do Git)
services:
  core-box:
    image: ${IMAGEM:?defina a variavel IMAGEM}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports:
      - "80:8000"
    env_file: .env.prod
    volumes:
      - dados:/dados
volumes:
  dados:
